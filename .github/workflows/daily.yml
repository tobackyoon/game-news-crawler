name: Daily Game News Briefing

# 언제 도는가:
#   - schedule: 매일 00:00 UTC = 09:00 KST (한국시간 아침 9시)
#   - workflow_dispatch: GitHub Actions 탭에서 수동 실행 버튼
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# 브리핑/상태 파일을 repo에 다시 커밋하려면 쓰기 권한이 필요
permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        run: python pipeline.py

      - name: 브리핑·상태 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefing.md _state/last_seen.json
          # 변경분이 없으면(=새 글 없음) 커밋을 건너뛴다
          git diff --staged --quiet && echo "변경 없음 — 커밋 생략" || git commit -m "chore: 게임 산업 브리핑 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
